name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run validate
                  npm run build
                  npm run lint

            - name: Verify release version
              run: |
                  tag="${GITHUB_REF_NAME}"
                  manifest_version="$(node -e "const fs = require('fs'); console.log(JSON.parse(fs.readFileSync('manifest.json', 'utf8')).version);")"
                  package_version="$(node -e "const fs = require('fs'); console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version);")"
                  versions_min_app="$(node -e "const fs = require('fs'); const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8')); console.log(versions[manifest.version] ?? '');")"
                  manifest_min_app="$(node -e "const fs = require('fs'); console.log(JSON.parse(fs.readFileSync('manifest.json', 'utf8')).minAppVersion);")"

                  if [ "$tag" != "$manifest_version" ]; then
                      echo "Release tag ($tag) must match manifest.json version ($manifest_version)."
                      exit 1
                  fi

                  if [ "$manifest_version" != "$package_version" ]; then
                      echo "manifest.json version ($manifest_version) must match package.json version ($package_version)."
                      exit 1
                  fi

                  if [ "$versions_min_app" != "$manifest_min_app" ]; then
                      echo "versions.json must map $manifest_version to minAppVersion $manifest_min_app."
                      exit 1
                  fi

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
